<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timestamp — Utils Antarquía</title>
<meta name="description" content="Convierte epoch (segundos o milisegundos) a fecha legible y viceversa.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,4 92,27 92,73 50,96 8,73 8,27' fill='%23ffc800'/%3E%3Cpolygon points='50,14 84,33 84,67 50,86 16,67 16,33' fill='%230a0a0a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/tool.css">
<style>
  .now{
    font-family:var(--mono);
    font-size:clamp(30px,7vw,52px);
    font-weight:700;
    letter-spacing:-.02em;
    color:var(--yellow);
    line-height:1.1;
  }
  .now small{font-size:14px;color:var(--muted);letter-spacing:.2em;margin-left:8px}
  .clock{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:8px}
  .rowline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px dashed #1d1a0f}
  .rowline:last-child{border-bottom:0}
  .rowline .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#7d775f;white-space:nowrap}
  .rowline .v{font-family:var(--mono);font-size:13px;color:var(--yellow-soft);text-align:right;word-break:break-all;flex:1}
  .mini{
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:#6b6654;background:transparent;border:1px solid #262112;border-radius:999px;padding:5px 10px;cursor:pointer;flex:0 0 auto;
  }
  .mini:hover{background:var(--yellow);border-color:var(--yellow);color:#000}
</style>
</head>
<body>

<nav class="top">
  <a class="back" href="../index.html">← panal</a>
  <div class="brand"><b>utils</b> / antarquía</div>
</nav>

<main>
  <div class="head">
    <div class="hexico"><span>⏱️</span></div>
    <div>
      <h1>Timestamp</h1>
      <p class="sub">Epoch ↔ fecha legible · zona local y UTC</p>
    </div>
  </div>

  <section class="card">
    <h2>Ahora</h2>
    <div class="now"><span id="epoch-s">—</span><small>epoch (s)</small></div>
    <div class="clock" id="clock">—</div>
    <div class="row">
      <button type="button" class="primary" id="btn-now">usar este instante</button>
      <button type="button" data-copy="#epoch-s">copiar epoch</button>
    </div>
  </section>

  <section class="card">
    <h2>Convertir</h2>
    <label class="lbl" for="input">Epoch (s o ms) o fecha (2024-05-01 12:30, ISO, etc.)</label>
    <input type="text" id="input" spellcheck="false" placeholder="1714570200 · 1714570200000 · 2024-05-01T12:30:00Z">
    <div class="row">
      <button type="button" class="primary" id="btn-run" data-run>convertir</button>
      <button type="button" class="ghost" id="btn-clear">limpiar</button>
    </div>
    <p class="hint" id="status">Los números de 10 dígitos se leen como segundos; de 13, como milisegundos.</p>
  </section>

  <section class="card" id="result-card" hidden>
    <h2>Resultado</h2>
    <div class="rowline"><span class="k">Local</span><span class="v" id="r-local">—</span><button type="button" class="mini" data-copy-val="r-local">copiar</button></div>
    <div class="rowline"><span class="k">UTC</span><span class="v" id="r-utc">—</span><button type="button" class="mini" data-copy-val="r-utc">copiar</button></div>
    <div class="rowline"><span class="k">ISO 8601</span><span class="v" id="r-iso">—</span><button type="button" class="mini" data-copy-val="r-iso">copiar</button></div>
    <div class="rowline"><span class="k">Epoch (s)</span><span class="v" id="r-s">—</span><button type="button" class="mini" data-copy-val="r-s">copiar</button></div>
    <div class="rowline"><span class="k">Epoch (ms)</span><span class="v" id="r-ms">—</span><button type="button" class="mini" data-copy-val="r-ms">copiar</button></div>
    <div class="rowline"><span class="k">Relativo</span><span class="v" id="r-rel">—</span></div>
  </section>
</main>

<footer><a href="../index.html">utils.antarquia.cl</a></footer>

<script src="../assets/tool.js"></script>
<script>
  const $input = $('#input');
  const $status = $('#status');
  const $card = $('#result-card');

  const pad = (n) => String(n).padStart(2, '0');

  function fmtLocal(d) {
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ` +
           `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  function fmtUtc(d) {
    return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())} ` +
           `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())} UTC`;
  }

  function relative(d) {
    const diff = d.getTime() - Date.now();
    const abs = Math.abs(diff);
    const units = [
      ['año', 31536000000], ['mes', 2592000000], ['día', 86400000],
      ['hora', 3600000], ['minuto', 60000], ['segundo', 1000]
    ];
    for (const [name, ms] of units) {
      if (abs >= ms) {
        const n = Math.floor(abs / ms);
        const plural = n === 1 ? '' : (name === 'mes' ? 'es' : 's');
        return diff < 0 ? `hace ${n} ${name}${plural}` : `dentro de ${n} ${name}${plural}`;
      }
    }
    return 'ahora mismo';
  }

  function tick() {
    const d = new Date();
    $('#epoch-s').textContent = Math.floor(d.getTime() / 1000);
    $('#clock').textContent = fmtLocal(d) + ' · ' + fmtUtc(d);
  }

  function parseInput(raw) {
    const value = raw.trim();
    if (!value) return null;

    if (/^-?\d+$/.test(value)) {
      const n = Number(value);
      const ms = Math.abs(n) < 1e11 ? n * 1000 : n;
      const d = new Date(ms);
      return isNaN(d) ? null : d;
    }
    const d = new Date(value.includes(' ') && !value.includes('T') ? value.replace(' ', 'T') : value);
    return isNaN(d) ? null : d;
  }

  function convert() {
    const d = parseInput($input.value);
    if (!d) {
      $card.hidden = true;
      if ($input.value.trim()) {
        $status.textContent = '✗ No pude interpretar eso como fecha o epoch.';
        $status.style.color = '#ff6b6b';
      } else {
        $status.textContent = 'Escribe un epoch o una fecha para convertir.';
        $status.style.color = '';
      }
      return;
    }
    $status.textContent = '✓ Convertido';
    $status.style.color = '#9be37a';
    $card.hidden = false;
    $('#r-local').textContent = fmtLocal(d);
    $('#r-utc').textContent = fmtUtc(d);
    $('#r-iso').textContent = d.toISOString();
    $('#r-s').textContent = Math.floor(d.getTime() / 1000);
    $('#r-ms').textContent = d.getTime();
    $('#r-rel').textContent = relative(d);
  }

  $$('[data-copy-val]').forEach(btn => {
    btn.addEventListener('click', () => copyText($('#' + btn.dataset.copyVal).textContent));
  });

  $('#btn-run').addEventListener('click', convert);
  $('#btn-clear').addEventListener('click', () => {
    $input.value = '';
    $card.hidden = true;
    $status.textContent = 'Escribe un epoch o una fecha para convertir.';
    $status.style.color = '';
    $input.focus();
  });
  $('#btn-now').addEventListener('click', () => {
    $input.value = Math.floor(Date.now() / 1000);
    convert();
  });
  $input.addEventListener('input', convert);

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
