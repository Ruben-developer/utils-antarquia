<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base64 — Utils Antarquía</title>
<meta name="description" content="Codifica y decodifica texto en Base64, con soporte UTF-8 y variante URL-safe.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,4 92,27 92,73 50,96 8,73 8,27' fill='%23ffc800'/%3E%3Cpolygon points='50,14 84,33 84,67 50,86 16,67 16,33' fill='%230a0a0a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/tool.css">
</head>
<body>

<nav class="top">
  <a class="back" href="../index.html">← panal</a>
  <div class="brand"><b>utils</b> / antarquía</div>
</nav>

<main>
  <div class="head">
    <div class="hexico"><span>🔤</span></div>
    <div>
      <h1>Base64</h1>
      <p class="sub">Codifica y decodifica texto en Base64 · UTF-8</p>
    </div>
  </div>

  <section class="card">
    <label class="lbl" for="input">Entrada</label>
    <textarea id="input" spellcheck="false" placeholder="Escribe o pega texto aquí…"></textarea>
    <div class="row">
      <button type="button" class="primary" id="btn-enc" data-run>Codificar →</button>
      <button type="button" id="btn-dec">← Decodificar</button>
      <button type="button" class="ghost" id="btn-swap">↕ swap</button>
      <button type="button" class="ghost" id="btn-clear">limpiar</button>
    </div>
  </section>

  <section class="card">
    <label class="lbl" for="output">Resultado</label>
    <div class="out" id="output"></div>
    <div class="row">
      <button type="button" data-copy="#output">copiar</button>
      <button type="button" class="ghost" id="btn-download">descargar .txt</button>
    </div>
    <p class="hint"><b>Ctrl/⌘ + Enter</b> codifica · se convierte en vivo mientras escribes</p>
  </section>
</main>

<footer><a href="../index.html">utils.antarquia.cl</a></footer>

<script src="../assets/tool.js"></script>
<script>
  const input  = $('#input');
  const output = $('#output');
  const encoder = new TextEncoder();
  const decoder = new TextDecoder();

  const toB64 = (str) => {
    const bytes = encoder.encode(str);
    let bin = '';
    bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin);
  };

  const fromB64 = (str) => {
    const clean = str.replace(/\s+/g, '').replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(clean.padEnd(clean.length + ((4 - clean.length % 4) % 4), '='));
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return decoder.decode(bytes);
  };

  function render(mode) {
    const value = input.value;
    output.classList.remove('err');
    if (!value.trim()) { output.textContent = ''; return; }
    try {
      output.textContent = mode === 'enc' ? toB64(value) : fromB64(value);
    } catch (e) {
      output.textContent = 'No es Base64 válido: ' + e.message;
      output.classList.add('err');
    }
  }

  let mode = 'enc';
  const setMode = (m) => { mode = m; render(mode); };

  $('#btn-enc').addEventListener('click', () => setMode('enc'));
  $('#btn-dec').addEventListener('click', () => setMode('dec'));
  input.addEventListener('input', () => render(mode));

  $('#btn-swap').addEventListener('click', () => {
    const prev = output.textContent;
    if (output.classList.contains('err')) return;
    input.value = prev;
    setMode(mode === 'enc' ? 'dec' : 'enc');
    input.focus();
  });

  $('#btn-clear').addEventListener('click', () => {
    input.value = '';
    output.textContent = '';
    input.focus();
  });

  $('#btn-download').addEventListener('click', () => {
    if (!output.textContent) return toast('nada que descargar');
    download('base64.txt', output.textContent);
  });
</script>
</body>
</html>
