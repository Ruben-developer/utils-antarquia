<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON — Utils Antarquía</title>
<meta name="description" content="Formatea, minifica y valida JSON en el navegador.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,4 92,27 92,73 50,96 8,73 8,27' fill='%23ffc800'/%3E%3Cpolygon points='50,14 84,33 84,67 50,86 16,67 16,33' fill='%230a0a0a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/tool.css">
</head>
<body>

<nav class="top">
  <a class="back" href="../index.html">← panal</a>
  <div class="brand"><b>utils</b> / antarquía</div>
</nav>

<main>
  <div class="head">
    <div class="hexico"><span>{ }</span></div>
    <div>
      <h1>JSON</h1>
      <p class="sub">Formatea · minifica · valida</p>
    </div>
  </div>

  <section class="card">
    <label class="lbl" for="input">Entrada</label>
    <textarea id="input" spellcheck="false" style="min-height:180px" placeholder='{"hola":"mundo","n":[1,2,3]}'></textarea>
    <div class="row">
      <button type="button" class="primary" id="btn-format" data-run>formatear</button>
      <button type="button" id="btn-min">minificar</button>
      <button type="button" id="btn-sort">ordenar claves</button>
      <button type="button" class="ghost" id="btn-clear">limpiar</button>
      <select id="indent" style="width:auto;padding:10px 14px">
        <option value="2">2 espacios</option>
        <option value="4">4 espacios</option>
        <option value="tab">tabulador</option>
      </select>
    </div>
    <p class="hint" id="status">Esperando entrada…</p>
  </section>

  <section class="card">
    <label class="lbl" for="output">Resultado</label>
    <div class="out" id="output" style="max-height:52vh;overflow:auto"></div>
    <div class="row">
      <button type="button" data-copy="#output">copiar</button>
      <button type="button" class="ghost" id="btn-download">descargar .json</button>
    </div>
  </section>
</main>

<footer><a href="../index.html">utils.antarquia.cl</a></footer>

<script src="../assets/tool.js"></script>
<script>
  const input  = $('#input');
  const output = $('#output');
  const status = $('#status');

  function lineCol(text, pos) {
    const before = text.slice(0, pos).split('\n');
    return { line: before.length, col: before[before.length - 1].length + 1 };
  }

  function parse() {
    const raw = input.value.trim();
    output.classList.remove('err', 'ok');
    if (!raw) {
      output.textContent = '';
      status.textContent = 'Esperando entrada…';
      status.style.color = '';
      return null;
    }
    try {
      const data = JSON.parse(raw);
      const size = new Blob([raw]).size;
      status.textContent = `✓ JSON válido · ${size} bytes · ${raw.split('\n').length} líneas`;
      status.style.color = '#9be37a';
      return data;
    } catch (e) {
      output.classList.add('err');
      const m = /position (\d+)/.exec(e.message);
      const where = m ? (() => { const { line, col } = lineCol(input.value, +m[1]); return ` (línea ${line}, columna ${col})`; })() : '';
      output.textContent = '✗ JSON inválido: ' + e.message.replace(/^JSON\.parse: /, '') + where;
      status.textContent = 'Revisa la sintaxis: comillas dobles, comas y llaves.';
      status.style.color = '#ff6b6b';
      return null;
    }
  }

  function sortKeys(value) {
    if (Array.isArray(value)) return value.map(sortKeys);
    if (value && typeof value === 'object') {
      return Object.keys(value).sort().reduce((acc, k) => (acc[k] = sortKeys(value[k]), acc), {});
    }
    return value;
  }

  function write(data, indent) {
    output.classList.remove('err');
    output.classList.add('ok');
    output.textContent = JSON.stringify(data, null, indent);
  }

  const indentValue = () => ($('#indent').value === 'tab' ? '\t' : Number($('#indent').value));

  $('#btn-format').addEventListener('click', () => {
    const data = parse();
    if (data === null) return;
    write(data, indentValue());
  });

  $('#btn-min').addEventListener('click', () => {
    const data = parse();
    if (data === null) return;
    write(data, 0);
  });

  $('#btn-sort').addEventListener('click', () => {
    const data = parse();
    if (data === null) return;
    write(sortKeys(data), indentValue());
  });

  $('#btn-clear').addEventListener('click', () => {
    input.value = '';
    output.textContent = '';
    output.classList.remove('err', 'ok');
    status.textContent = 'Esperando entrada…';
    status.style.color = '';
    input.focus();
  });

  $('#btn-download').addEventListener('click', () => {
    if (!output.textContent) return toast('nada que descargar');
    download('datos.json', output.textContent, 'application/json');
  });

  input.addEventListener('input', () => { if (input.value.trim()) parse(); });
</script>
</body>
</html>
