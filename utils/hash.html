<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hash — Utils Antarquía</title>
<meta name="description" content="Calcula MD5, SHA-1, SHA-256, SHA-384 y SHA-512 de cualquier texto.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,4 92,27 92,73 50,96 8,73 8,27' fill='%23ffc800'/%3E%3Cpolygon points='50,14 84,33 84,67 50,86 16,67 16,33' fill='%230a0a0a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/tool.css">
<style>
  .hashrow{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed #1d1a0f}
  .hashrow:last-child{border-bottom:0}
  .alg{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:#7d775f}
  .val{font-family:var(--mono);font-size:12.5px;color:var(--yellow-soft);word-break:break-all;line-height:1.45}
  .val.pending{color:#4a4530}
  .copy-mini{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#6b6654;background:transparent;border:1px solid #262112;border-radius:0;padding:5px 10px}
  .copy-mini:hover{background:var(--yellow);border-color:var(--yellow);color:#000}
  @media (max-width:620px){
    .hashrow{grid-template-columns:1fr auto;gap:4px 10px}
    .val{grid-column:1/-1}
  }
</style>
</head>
<body>

<nav class="top">
  <a class="back" href="../index.html">← panal</a>
  <div class="brand"><b>utils</b> / antarquía</div>
</nav>

<main>
  <div class="head">
    <div class="hexico"><span>#️⃣</span></div>
    <div>
      <h1>Hash</h1>
      <p class="sub">MD5 · SHA-1 · SHA-256 · SHA-384 · SHA-512</p>
    </div>
  </div>

  <section class="card">
    <label class="lbl" for="input">Texto</label>
    <textarea id="input" spellcheck="false" placeholder="Escribe o pega el texto a hashear…"></textarea>
    <div class="row">
      <button type="button" class="primary" id="btn-run" data-run>calcular</button>
      <button type="button" id="btn-copy-all">copiar todo</button>
      <button type="button" class="ghost" id="btn-clear">limpiar</button>
    </div>
    <p class="hint">Se recalcula en vivo · los hashes son de <b>UTF-8</b> · MD5 y SHA-1 son débiles para seguridad, sirven para checksums</p>
  </section>

  <section class="card">
    <h2>Resultado</h2>
    <div id="all">
      <div class="hashrow" data-alg="md5"><span class="alg">MD5</span><span class="val pending" data-out="md5">—</span><button type="button" class="copy-mini" data-copy-val="md5">copiar</button></div>
      <div class="hashrow" data-alg="sha1"><span class="alg">SHA-1</span><span class="val pending" data-out="sha1">—</span><button type="button" class="copy-mini" data-copy-val="sha1">copiar</button></div>
      <div class="hashrow" data-alg="sha256"><span class="alg">SHA-256</span><span class="val pending" data-out="sha256">—</span><button type="button" class="copy-mini" data-copy-val="sha256">copiar</button></div>
      <div class="hashrow" data-alg="sha384"><span class="alg">SHA-384</span><span class="val pending" data-out="sha384">—</span><button type="button" class="copy-mini" data-copy-val="sha384">copiar</button></div>
      <div class="hashrow" data-alg="sha512"><span class="alg">SHA-512</span><span class="val pending" data-out="sha512">—</span><button type="button" class="copy-mini" data-copy-val="sha512">copiar</button></div>
    </div>
  </section>
</main>

<footer><a href="../index.html">utils.antarquia.cl</a></footer>

<script src="../assets/tool.js"></script>
<script>
  /* ---------- MD5 (implementación clásica de dominio público) ---------- */
  const rol = (n, s) => ((n << s) | (n >>> (32 - s))) | 0;
  const F = (b, c, d) => (b & c) | (~b & d);
  const G = (b, c, d) => (b & d) | (c & ~d);
  const H = (b, c, d) => b ^ c ^ d;
  const I = (b, c, d) => c ^ (b | ~d);

  const ff = (a, b, c, d, x, s, t) => (rol((a + F(b, c, d) + x + t) | 0, s) + b) | 0;
  const gg = (a, b, c, d, x, s, t) => (rol((a + G(b, c, d) + x + t) | 0, s) + b) | 0;
  const hh = (a, b, c, d, x, s, t) => (rol((a + H(b, c, d) + x + t) | 0, s) + b) | 0;
  const ii = (a, b, c, d, x, s, t) => (rol((a + I(b, c, d) + x + t) | 0, s) + b) | 0;

  function md5(str) {
    const bytes = new TextEncoder().encode(str);
    const len = bytes.length;
    const nBlocks = ((len + 8) >> 6) + 1;
    const words = new Int32Array(nBlocks * 16);

    for (let i = 0; i < len; i++) words[i >> 2] |= bytes[i] << ((i % 4) * 8);
    words[len >> 2] |= 0x80 << ((len % 4) * 8);

    const bitLen = len * 8;
    words[nBlocks * 16 - 2] = bitLen | 0;
    words[nBlocks * 16 - 1] = Math.floor(bitLen / 4294967296) | 0;

    let a = 1732584193, b = -271733879, c = -1732584194, d = 271733878;

    for (let i = 0; i < words.length; i += 16) {
      const oa = a, ob = b, oc = c, od = d;

      a = ff(a, b, c, d, words[i + 0], 7, -680876936);
      d = ff(d, a, b, c, words[i + 1], 12, -389564586);
      c = ff(c, d, a, b, words[i + 2], 17, 606105819);
      b = ff(b, c, d, a, words[i + 3], 22, -1044525330);
      a = ff(a, b, c, d, words[i + 4], 7, -176418897);
      d = ff(d, a, b, c, words[i + 5], 12, 1200080426);
      c = ff(c, d, a, b, words[i + 6], 17, -1473231341);
      b = ff(b, c, d, a, words[i + 7], 22, -45705983);
      a = ff(a, b, c, d, words[i + 8], 7, 1770035416);
      d = ff(d, a, b, c, words[i + 9], 12, -1958414417);
      c = ff(c, d, a, b, words[i + 10], 17, -42063);
      b = ff(b, c, d, a, words[i + 11], 22, -1990404162);
      a = ff(a, b, c, d, words[i + 12], 7, 1804603682);
      d = ff(d, a, b, c, words[i + 13], 12, -40341101);
      c = ff(c, d, a, b, words[i + 14], 17, -1502002290);
      b = ff(b, c, d, a, words[i + 15], 22, 1236535329);

      a = gg(a, b, c, d, words[i + 1], 5, -165796510);
      d = gg(d, a, b, c, words[i + 6], 9, -1069501632);
      c = gg(c, d, a, b, words[i + 11], 14, 643717713);
      b = gg(b, c, d, a, words[i + 0], 20, -373897302);
      a = gg(a, b, c, d, words[i + 5], 5, -701558691);
      d = gg(d, a, b, c, words[i + 10], 9, 38016083);
      c = gg(c, d, a, b, words[i + 15], 14, -660478335);
      b = gg(b, c, d, a, words[i + 4], 20, -405537848);
      a = gg(a, b, c, d, words[i + 9], 5, 568446438);
      d = gg(d, a, b, c, words[i + 14], 9, -1019803690);
      c = gg(c, d, a, b, words[i + 3], 14, -187363961);
      b = gg(b, c, d, a, words[i + 8], 20, 1163531501);
      a = gg(a, b, c, d, words[i + 13], 5, -1444681467);
      d = gg(d, a, b, c, words[i + 2], 9, -51403784);
      c = gg(c, d, a, b, words[i + 7], 14, 1735328473);
      b = gg(b, c, d, a, words[i + 12], 20, -1926607734);

      a = hh(a, b, c, d, words[i + 5], 4, -378558);
      d = hh(d, a, b, c, words[i + 8], 11, -2022574463);
      c = hh(c, d, a, b, words[i + 11], 16, 1839030562);
      b = hh(b, c, d, a, words[i + 14], 23, -35309556);
      a = hh(a, b, c, d, words[i + 1], 4, -1530992060);
      d = hh(d, a, b, c, words[i + 4], 11, 1272893353);
      c = hh(c, d, a, b, words[i + 7], 16, -155497632);
      b = hh(b, c, d, a, words[i + 10], 23, -1094730640);
      a = hh(a, b, c, d, words[i + 13], 4, 681279174);
      d = hh(d, a, b, c, words[i + 0], 11, -358537222);
      c = hh(c, d, a, b, words[i + 3], 16, -722521979);
      b = hh(b, c, d, a, words[i + 6], 23, 76029189);
      a = hh(a, b, c, d, words[i + 9], 4, -640364487);
      d = hh(d, a, b, c, words[i + 12], 11, -421815835);
      c = hh(c, d, a, b, words[i + 15], 16, 530742520);
      b = hh(b, c, d, a, words[i + 2], 23, -995338651);

      a = ii(a, b, c, d, words[i + 0], 6, -198630844);
      d = ii(d, a, b, c, words[i + 7], 10, 1126891415);
      c = ii(c, d, a, b, words[i + 14], 15, -1416354905);
      b = ii(b, c, d, a, words[i + 5], 21, -57434055);
      a = ii(a, b, c, d, words[i + 12], 6, 1700485571);
      d = ii(d, a, b, c, words[i + 3], 10, -1894986606);
      c = ii(c, d, a, b, words[i + 10], 15, -1051523);
      b = ii(b, c, d, a, words[i + 1], 21, -2054922799);
      a = ii(a, b, c, d, words[i + 8], 6, 1873313359);
      d = ii(d, a, b, c, words[i + 15], 10, -30611744);
      c = ii(c, d, a, b, words[i + 6], 15, -1560198380);
      b = ii(b, c, d, a, words[i + 13], 21, 1309151649);
      a = ii(a, b, c, d, words[i + 4], 6, -145523070);
      d = ii(d, a, b, c, words[i + 11], 10, -1120210379);
      c = ii(c, d, a, b, words[i + 2], 15, 718787259);
      b = ii(b, c, d, a, words[i + 9], 21, -343485551);

      a = (a + oa) | 0; b = (b + ob) | 0; c = (c + oc) | 0; d = (d + od) | 0;
    }

    const hex = (n) => {
      let s = '';
      for (let i = 0; i < 4; i++) s += ((n >>> (i * 8)) & 0xff).toString(16).padStart(2, '0');
      return s;
    };
    return hex(a) + hex(b) + hex(c) + hex(d);
  }

  /* ---------- SHA vía WebCrypto ---------- */
  async function sha(algo, text) {
    const buf = await crypto.subtle.digest(algo, new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  const input = $('#input');
  const results = {};

  async function run() {
    const text = input.value;
    const outs = $$('[data-out]');

    if (!text) {
      outs.forEach(el => { el.textContent = '—'; el.classList.add('pending'); });
      Object.keys(results).forEach(k => delete results[k]);
      return;
    }

    results.md5 = md5(text);
    const [s1, s256, s384, s512] = await Promise.all([
      sha('SHA-1', text), sha('SHA-256', text), sha('SHA-384', text), sha('SHA-512', text)
    ]);
    Object.assign(results, { sha1: s1, sha256: s256, sha384: s384, sha512: s512 });

    outs.forEach(el => {
      const k = el.dataset.out;
      el.textContent = results[k];
      el.classList.remove('pending');
    });
  }

  input.addEventListener('input', run);
  $('#btn-run').addEventListener('click', run);
  $('#btn-clear').addEventListener('click', () => { input.value = ''; run(); input.focus(); });

  $$('[data-copy-val]').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = results[btn.dataset.copyVal];
      copyText(v && v !== '—' ? v : '');
    });
  });

  // copiar todo en formato "ALG: hash"
  const LABELS = { md5:'MD5', sha1:'SHA-1', sha256:'SHA-256', sha384:'SHA-384', sha512:'SHA-512' };
  $('#btn-copy-all').addEventListener('click', () => {
    if (!Object.keys(results).length) return toast('nada que copiar');
    copyText(Object.entries(results).map(([k, v]) => `${LABELS[k]}: ${v}`).join('\n'));
  });

  run();
</script>
</body>
</html>
