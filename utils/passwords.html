<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passwords — Utils Antarquía</title>
<meta name="description" content="Generador de contraseñas seguras con entropía calculada, 100% local.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,4 92,27 92,73 50,96 8,73 8,27' fill='%23ffc800'/%3E%3Cpolygon points='50,14 84,33 84,67 50,86 16,67 16,33' fill='%230a0a0a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/tool.css">
<style>
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:6px}
  .opt{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12.5px;color:var(--muted);cursor:pointer}
  .opt input{accent-color:var(--yellow);width:16px;height:16px;cursor:pointer}
  .opt:hover{color:var(--text)}
  .lenrow{display:flex;align-items:center;gap:16px;margin-bottom:6px}
  input[type=range]{flex:1;accent-color:var(--yellow);height:4px;cursor:pointer}
  .lenval{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--yellow);min-width:58px;text-align:right}
  .pwd{
    font-family:var(--mono);
    font-size:clamp(16px,3.2vw,24px);
    letter-spacing:.06em;
    color:var(--yellow-soft);
    background:#0b0b0b;
    border:1px dashed #2a2411;
    border-radius:0;
    padding:18px 16px;
    word-break:break-all;
    min-height:64px;
    display:flex;align-items:center;
  }
  .meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:#6b6654;margin-top:10px;letter-spacing:.08em}
  @media (max-width:620px){.opts{grid-template-columns:1fr}}
</style>
</head>
<body>

<nav class="top">
  <a class="back" href="../index.html">← panal</a>
  <div class="brand"><b>utils</b> / antarquía</div>
</nav>

<main>
  <div class="head">
    <div class="hexico"><span>🔑</span></div>
    <div>
      <h1>Passwords</h1>
      <p class="sub">Generación local con crypto.getRandomValues</p>
    </div>
  </div>

  <section class="card">
    <h2>Contraseña</h2>
    <div class="pwd" id="pwd">—</div>
    <div class="strength"><i id="bar"></i></div>
    <div class="meta"><span id="entropy">0 bits</span><span id="verdict">—</span></div>
    <div class="row">
      <button type="button" class="primary" id="btn-gen" data-run>generar</button>
      <button type="button" data-copy="#pwd">copiar</button>
    </div>
  </section>

  <section class="card">
    <h2>Ajustes</h2>
    <div class="lenrow">
      <label class="lbl" for="len" style="margin:0">Largo</label>
      <input type="range" id="len" min="6" max="128" value="20">
      <span class="lenval" id="lenval">20</span>
    </div>
    <div class="opts">
      <label class="opt"><input type="checkbox" id="lower" checked> minúsculas (a-z)</label>
      <label class="opt"><input type="checkbox" id="upper" checked> MAYÚSCULAS (A-Z)</label>
      <label class="opt"><input type="checkbox" id="digits" checked> números (0-9)</label>
      <label class="opt"><input type="checkbox" id="symbols" checked> símbolos (!@#$…)</label>
      <label class="opt"><input type="checkbox" id="noconfuse"> sin caracteres confusos</label>
      <label class="opt"><input type="checkbox" id="nospace"> sin espacios</label>
    </div>
    <p class="hint">Nada se envía a ningún servidor: todo ocurre en tu navegador. <b>Ctrl/⌘ + Enter</b> genera otra.</p>
  </section>
</main>

<footer><a href="../index.html">utils.antarquia.cl</a></footer>

<script src="../assets/tool.js"></script>
<script>
  const SETS = {
    lower: 'abcdefghijklmnopqrstuvwxyz',
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    digits: '0123456789',
    symbols: '!@#$%^&*()-_=+[]{};:,.?/|~'
  };
  const CONFUSE = 'il1Lo0O';
  const SPACE = ' ';

  const $pwd = $('#pwd'), $bar = $('#bar'), $len = $('#len'), $lenval = $('#lenval');
  const $entropy = $('#entropy'), $verdict = $('#verdict');

  function pool() {
    let chars = '';
    for (const k of Object.keys(SETS)) if ($('#' + k).checked) chars += SETS[k];
    if (!chars) chars = SETS.lower;
    if ($('#noconfuse').checked) chars = [...chars].filter(c => !CONFUSE.includes(c)).join('');
    if (!$('#nospace').checked) chars += SPACE;
    return chars;
  }

  function randomInt(max) {
    const limit = Math.floor(0xFFFFFFFF / max) * max;
    const buf = new Uint32Array(1);
    let n;
    do { crypto.getRandomValues(buf); n = buf[0]; } while (n >= limit);
    return n % max;
  }

  function generate() {
    const chars = pool();
    const length = Number($len.value);
    let out = '';
    for (let i = 0; i < length; i++) out += chars[randomInt(chars.length)];
    $pwd.textContent = out;

    const bits = Math.round(length * Math.log2(chars.length));
    $entropy.textContent = `${bits} bits · ${chars.length} caracteres posibles`;

    const pct = Math.min(100, (bits / 128) * 100);
    let color = '#ff5252', label = 'débil';
    if (bits >= 60) { color = '#ffc800'; label = 'aceptable'; }
    if (bits >= 80) { color = '#b6e35a'; label = 'fuerte'; }
    if (bits >= 110) { color = '#9be37a'; label = 'muy fuerte'; }
    $bar.style.width = pct + '%';
    $bar.style.background = color;
    $verdict.textContent = label;
    $verdict.style.color = color;
  }

  $len.addEventListener('input', () => { $lenval.textContent = $len.value; generate(); });
  $$('input[type=checkbox]').forEach(c => c.addEventListener('change', generate));
  $('#btn-gen').addEventListener('click', generate);

  generate();
</script>
</body>
</html>
