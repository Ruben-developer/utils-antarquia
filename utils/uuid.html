<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UUID — Utils Antarquía</title>
<meta name="description" content="Genera UUID v4 y v7 en el navegador.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,4 92,27 92,73 50,96 8,73 8,27' fill='%23ffc800'/%3E%3Cpolygon points='50,14 84,33 84,67 50,86 16,67 16,33' fill='%230a0a0a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/tool.css">
<style>
  .uuidlist{font-family:var(--mono);font-size:13.5px;line-height:1.9;color:var(--yellow-soft);word-break:break-all}
  .uuidlist div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed #1d1a0f;padding:4px 0}
  .uuidlist div:last-child{border-bottom:0}
  .uuidlist button{
    font-size:10px;padding:3px 9px;border-radius:0;letter-spacing:.08em;
    background:transparent;border:1px solid #262112;color:#6b6654;
  }
  .uuidlist button:hover{background:var(--yellow);border-color:var(--yellow);color:#000}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
  .opt{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12.5px;color:var(--muted);cursor:pointer}
  .opt input{accent-color:var(--yellow);width:16px;height:16px;cursor:pointer}
  @media (max-width:620px){.opts{grid-template-columns:1fr}}
</style>
</head>
<body>

<nav class="top">
  <a class="back" href="../index.html">← panal</a>
  <div class="brand"><b>utils</b> / antarquía</div>
</nav>

<main>
  <div class="head">
    <div class="hexico"><span>🆔</span></div>
    <div>
      <h1>UUID</h1>
      <p class="sub">v4 aleatorio · v7 ordenable por tiempo</p>
    </div>
  </div>

  <section class="card">
    <div class="row" style="margin-top:0">
      <button type="button" class="primary" id="btn-gen" data-run>generar</button>
      <button type="button" id="btn-copy-all">copiar todo</button>
      <select id="version" style="width:auto;padding:10px 14px">
        <option value="v4">UUID v4</option>
        <option value="v7">UUID v7</option>
      </select>
      <input type="number" id="count" value="5" min="1" max="100" style="width:90px" aria-label="Cantidad">
    </div>
  </section>

  <section class="card">
    <h2>Resultado</h2>
    <div class="uuidlist" id="list"></div>
  </section>

  <section class="card">
    <h2>Formato</h2>
    <div class="opts">
      <label class="opt"><input type="checkbox" id="upper"> MAYÚSCULAS</label>
      <label class="opt"><input type="checkbox" id="nodash"> sin guiones</label>
      <label class="opt"><input type="checkbox" id="braces"> con { llaves }</label>
    </div>
    <p class="hint">v4 es aleatorio puro. <b>v7</b> incluye el timestamp al inicio, ideal para claves ordenables.</p>
  </section>
</main>

<footer><a href="../index.html">utils.antarquia.cl</a></footer>

<script src="../assets/tool.js"></script>
<script>
  const $list = $('#list');
  let current = [];

  function uuidv4() {
    if (crypto.randomUUID) return crypto.randomUUID();
    const b = crypto.getRandomValues(new Uint8Array(16));
    b[6] = (b[6] & 0x0f) | 0x40;
    b[8] = (b[8] & 0x3f) | 0x80;
    const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
    return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
  }

  function uuidv7() {
    const ms = Date.now();
    const b = crypto.getRandomValues(new Uint8Array(16));
    b[0] = Math.floor(ms / 2 ** 40) & 0xff;
    b[1] = Math.floor(ms / 2 ** 32) & 0xff;
    b[2] = Math.floor(ms / 2 ** 24) & 0xff;
    b[3] = Math.floor(ms / 2 ** 16) & 0xff;
    b[4] = Math.floor(ms / 2 ** 8) & 0xff;
    b[5] = ms & 0xff;
    b[6] = (b[6] & 0x0f) | 0x70;
    b[8] = (b[8] & 0x3f) | 0x80;
    const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
    return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
  }

  function format(uuid) {
    let s = uuid;
    if ($('#nodash').checked) s = s.replace(/-/g, '');
    if ($('#upper').checked) s = s.toUpperCase();
    if ($('#braces').checked) s = '{' + s + '}';
    return s;
  }

  function generate() {
    const n = Math.max(1, Math.min(100, Number($('#count').value) || 1));
    const maker = $('#version').value === 'v7' ? uuidv7 : uuidv4;
    $list.innerHTML = '';
    current = [];
    for (let i = 0; i < n; i++) {
      const value = format(maker());
      current.push(value);
      const row = document.createElement('div');
      const span = document.createElement('span');
      span.textContent = value;
      const btn = document.createElement('button');
      btn.textContent = 'copiar';
      btn.addEventListener('click', () => copyText(value));
      row.append(span, btn);
      $list.appendChild(row);
    }
  }

  $('#btn-gen').addEventListener('click', generate);
  $('#btn-copy-all').addEventListener('click', () => copyText(current.join('\n')));
  $$('input[type=checkbox]').forEach(c => c.addEventListener('change', generate));
  $('#version').addEventListener('change', generate);
  $('#count').addEventListener('change', generate);

  generate();
</script>
</body>
</html>
