<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Utils Antarquía</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,4 92,27 92,73 50,96 8,73 8,27' fill='%23ffc800'/%3E%3Cpolygon points='50,14 84,33 84,67 50,86 16,67 16,33' fill='%230a0a0a'/%3E%3C/svg%3E">
<!--
  Página autocontenida a propósito: GitHub Pages sirve el 404 en la ruta
  solicitada, así que las rutas relativas a assets/ fallarían según la
  profundidad. El enlace a la raíz se calcula en el script del final.
-->
<style>
  :root{
    --bg:#0a0a0a; --yellow:#ffc800; --text:#f4f1e6; --muted:#8b8672;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:radial-gradient(ellipse at 50% 0%,#1a1500 0%,var(--bg) 55%),var(--bg);
    color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;
  }
  .top{
    width:100%;max-width:980px;margin:0 auto;padding:18px 22px 0;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  }
  .top a{color:var(--muted);text-decoration:none}
  .top a:hover,.top a:focus-visible{color:var(--yellow)}
  .brand b{color:var(--yellow)}
  main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  h1{font-size:clamp(56px,14vw,120px);letter-spacing:-.05em;color:var(--yellow);line-height:1}
  .sub{margin-top:10px;color:var(--muted);font-size:15px}
  .btn{
    display:inline-block;margin-top:24px;padding:12px 20px;border:1px solid var(--yellow);
    border-radius:8px;background:var(--yellow);color:#000;text-decoration:none;
    font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  }
  .btn:hover,.btn:focus-visible{background:transparent;color:var(--yellow)}
  footer{padding:6px 16px 30px;text-align:center;font-family:var(--mono);font-size:12px}
  footer a{color:#4a4530;text-decoration:none}
  footer a:hover{color:var(--yellow)}
</style>
</head>
<body>

<nav class="top">
  <a data-root href="/">← panal</a>
  <div class="brand"><b>utils</b> / antarquía</div>
</nav>

<main>
  <div>
    <h1>404</h1>
    <p class="sub">Esta celda del panal está vacía.</p>
    <a class="btn" data-root href="/">volver a utils</a>
  </div>
</main>

<footer><a data-root href="/">utils.antarquia.cl</a></footer>

<script>
  /* En GitHub Pages el sitio vive en /utils-antarquia/; en el dominio propio, en la raíz. */
  (function () {
    var base = /\.github\.io$/i.test(location.hostname) ? '/utils-antarquia/' : '/';
    var enlaces = document.querySelectorAll('[data-root]');
    for (var i = 0; i < enlaces.length; i++) enlaces[i].setAttribute('href', base);
  })();
</script>
</body>
</html>
